<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ordenamiento por filtro</title>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f6f9;
  }

  h1 { color: #333; }

  #controls {
    margin: 20px;
    padding: 15px;
    background: #fff;
    display: inline-block;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  select, button, input {
    padding: 8px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  /* MEJORA: Estilo para el control de velocidad */
  .speed-control {
    display: block;
    margin-top: 10px;
    font-size: 0.9em;
    color: #555;
  }

  #canvas {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 320px;
    margin: 30px auto;
    border: 2px solid #ccc;
    background: white;
    width: 80%;
  }

  .bar {
    margin: 0 4px;
    background: #4CAF50;
    color: white;
    font-size: 11px;
    text-align: center;
    border-radius: 4px 4px 0 0;
    transition: all 0.2s ease;
  }

  .active { background: #e74c3c !important; } /* Rojo: Comparando */
  .swap { background: #f1c40f !important; }   /* Amarillo: Intercambiando */
</style>
</head>

<body>

<h1>Bubble Sort - Visualización de Pedidos</h1>

<div id="controls">

  <label>Metodo:</label>
  <select id="metodo">
    <option value="bubble_sort">Bubble</option>
    <option value="selection_sort">Selección</option>
    <option value="insertion_sort">Inserción</option>
    <option value="shell_sort">Shell</option>
  </select>

  <label>Criterio:</label>
  <select id="criterio">
    <option value="tiempo_produccion">Producción</option>
    <option value="tiempo_entrega">Entrega</option>
    <option value="prioridad">Prioridad</option>
  </select>

  <label>Orden:</label>
  <select id="orden">
    <option value="asc">Ascendente</option>
    <option value="desc">Descendente</option>
  </select>

  <button onclick="iniciar()">Iniciar Ordenamiento</button>
  <button onclick="generarNuevaLista()">Nuevos Datos</button>

  <div class="speed-control">
    Velocidad: Lento <input type="range" id="velocidad" min="50" max="1000" value="300" step="50"> Rápido
  </div>
</div>

<div id="canvas"></div>

<h2>Tabla de Datos</h2>
<table border="1" style="margin:auto; border-collapse: collapse; width: 60%; background: white;">
  <thead>
    <tr style="background: #eee;">
      <th>Índice</th>
      <th>Producción</th>
      <th>Entrega</th>
      <th>Prioridad</th>
    </tr>
  </thead>
  <tbody id="tablaBody"></tbody>
</table>

<script>
class Pedido {
  constructor(produccion, entrega, prioridad) {
    this.tiempo_produccion = produccion;
    this.tiempo_entrega = entrega;
    this.prioridad = prioridad;
  }
}

let pedidos = [];

function rand(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

function generarPedidos(n = 10) {
  pedidos = [];
  for (let i = 0; i < n; i++) {
    pedidos.push(new Pedido(rand(20, 250), rand(30, 400), rand(1, 6)));
  }
}

// <--- MEJORA: Sincronización inicial de la tabla
function dibujarTodo(array, key, active = [], swap = []) {
  dibujarGrafico(array, key, active, swap);
  dibujarTabla(array, active, swap);
}

function dibujarTabla(array, active = [], swap = []) {
  const tbody = document.getElementById("tablaBody");
  tbody.innerHTML = "";

  array.forEach((p, i) => {
    const fila = document.createElement("tr");
    if (active.includes(i)) fila.style.background = "#ffcccc";
    if (swap.includes(i)) fila.style.background = "#fff3cd";

    fila.innerHTML = `
      <td>${i}</td>
      <td>${p.tiempo_produccion}</td>
      <td>${p.tiempo_entrega}</td>
      <td>${p.prioridad}</td>
    `;
    tbody.appendChild(fila);
  });
}

function dibujarGrafico(array, key, active = [], swap = []) {
  const canvas = document.getElementById("canvas");
  canvas.innerHTML = "";

  array.forEach((p, i) => {
    const bar = document.createElement("div");
    const val = p[key];

    // <--- MEJORA: Escalado visual para la Prioridad (valores 1-5)
    let alturaVisual = (key === 'prioridad') ? val * 50 : val;

    bar.className = "bar";
    bar.style.height = alturaVisual + "px";
    bar.style.width = "35px";
    bar.textContent = val; // Muestra el valor real sobre la barra

    if (active.includes(i)) bar.classList.add("active");
    if (swap.includes(i)) bar.classList.add("swap");

    canvas.appendChild(bar);
  });
}

async function bubbleSort(arr, key, asc = true) {
  let n = arr.length;

  for (let i = 0; i < n; i++) {
    let swapped = false;
    for (let j = 0; j < n - i - 1; j++) {
      
      // <--- MEJORA: Uso de la velocidad dinámica del slider
      let delay = 1050 - document.getElementById("velocidad").value;

      dibujarTodo(arr, key, [j, j+1]);
      await new Promise(r => setTimeout(r, delay));

      let cond = asc ? arr[j][key] > arr[j+1][key] : arr[j][key] < arr[j+1][key];

      if (cond) {
        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
        swapped = true;
        dibujarTodo(arr, key, [], [j, j+1]);
        await new Promise(r => setTimeout(r, delay));
      }
    }
    if (!swapped) break;
  }
  dibujarTodo(arr, key); // Dibujo final limpio
}

async function selectionSort(arr, key, asc) {
    let n = arr.length;
    for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        for (let j = i + 1; j < n; j++) {
            dibujarTodo(arr, key, [j, minIdx]); // Visualiza comparación
            await new Promise(r => setTimeout(r, getDelay()));
            let cond = asc ? arr[j][key] < arr[minIdx][key] : arr[j][key] > arr[minIdx][key];
            if (cond) minIdx = j;
        }
        if (minIdx !== i) {
            [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
            dibujarTodo(arr, key, [], [i, minIdx]); // Visualiza intercambio
            await new Promise(r => setTimeout(r, getDelay()));
        }
    }
}

// 3. Insertion Sort (NUEVO)
async function insertionSort(arr, key, asc) {
    let n = arr.length;
    for (let i = 1; i < n; i++) {
        let actual = arr[i];
        let j = i - 1;
        while (j >= 0) {
            dibujarTodo(arr, key, [j, j + 1]);
            await new Promise(r => setTimeout(r, getDelay()));
            let cond = asc ? arr[j][key] > actual[key] : arr[j][key] < actual[key];
            if (cond) {
                arr[j + 1] = arr[j];
                j--;
                dibujarTodo(arr, key, [], [j + 1]);
            } else {
                break;
            }
        }
        arr[j + 1] = actual;
        dibujarTodo(arr, key, [], [j + 1]);
        await new Promise(r => setTimeout(r, getDelay()));
    }
}

// 4. Shell Sort (NUEVO)
async function shellSort(arr, key, asc) {
    let n = arr.length;
    for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
        for (let i = gap; i < n; i++) {
            let temp = arr[i];
            let j = i;
            while (j >= gap) {
                dibujarTodo(arr, key, [j, j - gap]);
                await new Promise(r => setTimeout(r, getDelay()));
                let cond = asc ? arr[j - gap][key] > temp[key] : arr[j - gap][key] < temp[key];
                if (cond) {
                    arr[j] = arr[j - gap];
                    j -= gap;
                    dibujarTodo(arr, key, [], [j]);
                } else {
                    break;
                }
            }
            arr[j] = temp;
            dibujarTodo(arr, key, [], [j]);
        }
    }
}

async function iniciar() {
    const metodo = document.getElementById("metodo").value;
    const criterio = document.getElementById("criterio").value;
    const orden = document.getElementById("orden").value;
    const esAsc = (orden === "asc");

    // Deshabilitar botones durante la animación
    document.querySelectorAll("button").forEach(b => b.disabled = true);

    if (metodo === "bubble_sort") await bubbleSort(pedidos, criterio, esAsc);
    if (metodo === "selection_sort") await selectionSort(pedidos, criterio, esAsc);
    if (metodo === "insertion_sort") await insertionSort(pedidos, criterio, esAsc);
    if (metodo === "shell_sort") await shellSort(pedidos, criterio, esAsc);

    document.querySelectorAll("button").forEach(b => b.disabled = false);
    dibujarTodo(pedidos, criterio);
}

function generarNuevaLista() {
  generarPedidos();
  const criterio = document.getElementById("criterio").value;
  dibujarTodo(pedidos, criterio);
}

// <--- MEJORA: Carga inicial completa al abrir la página
generarPedidos();
dibujarTodo(pedidos, "tiempo_produccion");

</script>
</body>
</html>
