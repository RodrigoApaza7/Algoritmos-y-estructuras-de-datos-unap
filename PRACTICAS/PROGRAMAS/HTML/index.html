<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bubble Sort Visual</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f4f6f9;
  }

  h1 { color: #333; }

  #controls {
    margin: 20px;
  }

  select, button {
    padding: 8px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  #canvas {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 320px;
    margin: 30px auto;
    border: 2px solid #ccc;
    background: white;
    width: 80%;
  }

  .bar {
    margin: 0 4px;
    background: #4CAF50;
    color: white;
    font-size: 12px;
    text-align: center;
    border-radius: 4px 4px 0 0;
    transition: all 0.3s ease;
  }

  .active {
    background: #e74c3c !important;
  }

  .swap {
    background: #f1c40f !important;
  }
</style>
</head>

<body>

<h1>Bubble Sort - Visualización</h1>

<div id="controls">
  <select id="criterio">
    <option value="tiempo_produccion">Producción</option>
    <option value="tiempo_entrega">Entrega</option>
    <option value="prioridad">Prioridad</option>
  </select>

  <select id="orden">
    <option value="asc">Ascendente</option>
    <option value="desc">Descendente</option>
  </select>

  <button onclick="iniciar()">Iniciar</button>
  <button onclick="reiniciar()">Reiniciar</button>
</div>

<div id="canvas"></div>

<script>
class Pedido {
  constructor(produccion, entrega, prioridad) {
    this.tiempo_produccion = produccion;
    this.tiempo_entrega = entrega;
    this.prioridad = prioridad;
  }
}

let pedidos = [];
let delay = 300;

// Generar datos
function generarPedidos(n = 10) {
  pedidos = [];
  for (let i = 0; i < n; i++) {
    pedidos.push(new Pedido(
      rand(20, 250),
      rand(30, 400),
      rand(1, 5)
    ));
  }
}

function rand(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// Dibujar
function dibujar(array, key, active = [], swap = []) {
  const canvas = document.getElementById("canvas");
  canvas.innerHTML = "";

  array.forEach((p, i) => {
    const bar = document.createElement("div");
    const val = p[key];

    bar.className = "bar";
    bar.style.height = val + "px";
    bar.style.width = "35px";
    bar.textContent = val;

    if (active.includes(i)) bar.classList.add("active");
    if (swap.includes(i)) bar.classList.add("swap");

    canvas.appendChild(bar);
  });
}

// Espera
function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Bubble Sort mejorado (con animación visual)
async function bubbleSort(arr, key, asc = true) {
  let n = arr.length;

  for (let i = 0; i < n; i++) {
    let swapped = false;

    for (let j = 0; j < n - i - 1; j++) {
      dibujar(arr, key, [j, j+1]);
      await sleep(delay);

      let cond = asc 
        ? arr[j][key] > arr[j+1][key]
        : arr[j][key] < arr[j+1][key];

      if (cond) {
        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
        swapped = true;

        dibujar(arr, key, [], [j, j+1]);
        await sleep(delay);
      }
    }

    if (!swapped) break; // optimización
  }
}

// Iniciar
function iniciar() {
  generarPedidos();

  const criterio = document.getElementById("criterio").value;
  const orden = document.getElementById("orden").value;

  dibujar(pedidos, criterio);
  bubbleSort(pedidos, criterio, orden === "asc");
}

// Reiniciar
function reiniciar() {
  iniciar();
}

// Inicial automático
generarPedidos();
dibujar(pedidos, "tiempo_produccion");
</script>

</body>
</html>
